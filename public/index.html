<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Text Detector</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background"></div>

    <div class="app">
      <div class="card">
        <h1>AI Text Detector</h1>
        <button class="theme-toggle" id="themeToggle">🌙</button>
        <p class="tagline">
          Detect whether a text is written by a human or AI generated 
        </p>

        <textarea
          id="inputText"
          placeholder="Paste your text here..."
        ></textarea>

        <button id="checkBtn">Analyze Text</button>

        <div id="loader" class="loader"></div>

        <div id="result" class="result"></div>

        <div class="confidence" id="confidenceBox">
          <div class="confidence-label">
            Confidence: <span id="confidenceValue">0%</span>
          </div>
          <div class="confidence-bar">
            <div class="confidence-fill" id="confidenceFill"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
